[package]
name = "flow"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Traceable network-flow algorithms for the visualizer"

[dependencies]
num-bigint = "=0.4.6"
num-rational = { version = "=0.4.2", default-features = false, features = ["num-bigint-std"] }
num-traits = "=0.2.19"
schemars = "=1.2.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings", "serde-json-impl"] }
visualizer-core = { path = "../visualizer-core", version = "=0.1.0" }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
